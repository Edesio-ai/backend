name: Staging CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  migrate_and_deploy:
    name: Migrate DB + Deploy Render
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply DB migrations
        run: supabase db push --db-url "${{ secrets.STAGING_SUPABASE_DB_URL }}"

      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"