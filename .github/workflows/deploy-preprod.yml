name: Deploy Preprod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-preprod
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  deploy:
    name: Migrate DB + Deploy Preprod
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate preprod DB URL uses IPv4 pooler
        env:
          DB_URL: ${{ secrets.PREPROD_SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::PREPROD_SUPABASE_DB_URL is empty. Add it in repo or environment 'preprod' secrets."
            exit 1
          fi
          if echo "$DB_URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::PREPROD_SUPABASE_DB_URL uses direct db.*.supabase.co host (IPv6)."
            echo "Use Connect → Session/Transaction pooler URI (host must contain pooler.supabase.com)."
            echo "Environment secrets on 'preprod' override repository secrets — update the right one."
            exit 1
          fi
          if echo "$DB_URL" | grep -q 'pooler.supabase.com'; then
            echo "OK: connection string uses pooler.supabase.com (IPv4)"
          else
            echo "WARN: pooler.supabase.com not detected in URL; continuing anyway"
          fi

      - name: Apply preprod DB migrations
        run: supabase db push --yes --remote="${{ secrets.PREPROD_SUPABASE_DB_URL }}"

      - name: Trigger Render preprod deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_PREPROD }}" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_PREPROD"
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PREPROD }}"
          echo "Render preprod deploy triggered"
