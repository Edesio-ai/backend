name: Deploy Production

# Manual only — never triggered by push/merge to main
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deployment'
        required: true
        type: string

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  quality:
    name: Lint + Tests + Build
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  deploy:
    name: Migrate DB + Deploy Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.event.inputs.confirm == 'deploy'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production DB URL uses IPv4 pooler
        env:
          DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::PROD_SUPABASE_DB_URL is empty. Add it in repo or environment 'production' secrets."
            exit 1
          fi
          if echo "$DB_URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::PROD_SUPABASE_DB_URL uses direct db.*.supabase.co host (IPv6)."
            echo "Use Connect → Session pooler URI (host must contain pooler.supabase.com)."
            echo "Environment secrets on 'production' override repository secrets — update the right one."
            exit 1
          fi
          if echo "$DB_URL" | grep -q 'pooler.supabase.com'; then
            echo "OK: connection string uses pooler.supabase.com (IPv4)"
          else
            echo "WARN: pooler.supabase.com not detected in URL; continuing anyway"
          fi

      - name: Apply production DB migrations
        run: supabase db push --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"

      - name: Trigger Render production deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_PROD"
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
          echo "Render production deploy triggered"
